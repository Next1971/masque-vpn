# Kernel UDP socket buffer ceilings for the MASQUE QUIC listener.
# Default Linux values (~208 KiB) drop datagrams under load; 64 MiB matches
# the size used on the reference server.
#
# Install:
#   cp server/sysctl/99-masque-udp.conf /etc/sysctl.d/99-masque-udp.conf
#   sysctl --system
#
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864

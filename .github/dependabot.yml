version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/android/go-src/masque-vpn-mvp"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/windows"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    # Skip major upgrades of the Android Gradle Plugin and the Gradle wrapper.
    # AGP 9.x / Gradle 9.x is a coordinated migration (requires Kotlin 2.x and
    # targetSdk changes) and must be done deliberately, not via automatic PRs.
    # Minor and patch updates (including security fixes) are still allowed.
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

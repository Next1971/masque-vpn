version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/android/go-src/masque-vpn"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/windows"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

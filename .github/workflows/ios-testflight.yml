name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    name: Sign and upload
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"

      - name: Require signing secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_APP_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_APP_BASE64 }}
          BUILD_PROVISION_PROFILE_EXT_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_EXT_BASE64 }}
        run: |
          missing=0
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY APPLE_TEAM_ID BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_APP_BASE64 BUILD_PROVISION_PROFILE_EXT_BASE64; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets listed in ios/README.md (TestFlight via GitHub), then run this workflow again."
            exit 1
          fi

      - name: Build Mobile.xcframework
        run: bash ios/scripts/build-xcframework.sh

      - name: Decode signing files
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_APP_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_APP_BASE64 }}
          BUILD_PROVISION_PROFILE_EXT_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_EXT_BASE64 }}
        run: |
          mkdir -p ios/build-signing
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > ios/build-signing/dist.p12
          echo "$BUILD_PROVISION_PROFILE_APP_BASE64" | base64 --decode > ios/build-signing/app.mobileprovision
          echo "$BUILD_PROVISION_PROFILE_EXT_BASE64" | base64 --decode > ios/build-signing/tunnel.mobileprovision

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Upload to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          CERT_PATH: ${{ github.workspace }}/ios/build-signing/dist.p12
          APP_PROFILE_PATH: ${{ github.workspace }}/ios/build-signing/app.mobileprovision
          EXT_PROFILE_PATH: ${{ github.workspace }}/ios/build-signing/tunnel.mobileprovision
        run: fastlane beta

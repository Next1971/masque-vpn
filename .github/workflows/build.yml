name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server-build:
    name: Server (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"

      - name: Build server
        working-directory: android/go-src/masque-vpn-mvp
        run: go build -v ./...

      - name: Vet
        working-directory: android/go-src/masque-vpn-mvp
        run: go vet ./...

  windows-build:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config

      - name: Fetch wintun.dll
        working-directory: windows
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-wintun.ps1

      - name: Build service and console client
        working-directory: windows
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist -Force | Out-Null
          go build -v -o dist/vpn-client.exe ./cmd/vpn-client
          go build -v -o dist/masque-svc.exe ./cmd/vpn-service

      - name: Build Fyne GUI
        working-directory: windows
        env:
          CGO_ENABLED: "1"
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          go build -v -ldflags "-H windowsgui" -o dist/masque-gui.exe ./cmd/vpn-gui

      - name: Vet
        working-directory: windows
        env:
          CGO_ENABLED: "1"
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          go vet ./...

      - name: Install WiX
        run: dotnet tool install --global wix --version 7.0.0

      - name: Build MSI
        working-directory: windows
        # WiX v7 OSMF: https://wixtoolset.org/osmf/ (fee $0 under $10k revenue)
        run: wix build -acceptEula wix7 .\installer\masque.wxs -bindpath bin=dist -out dist\masque.msi -arch x64

  android-build:
    name: Android (AAR + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      - name: Ensure libs directory exists
        working-directory: android
        run: mkdir -p app/libs

      - name: Build AAR
        working-directory: android/go-src/masque-vpn-mvp
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: gomobile bind -target=android -androidapi 24 -o ../../app/libs/masque.aar ./mobile

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
